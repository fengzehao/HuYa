name: 虎牙虎粮自动发放

on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:

jobs:
  send-hl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUYA_COOKIE: ${{ secrets.HUYA_COOKIE }}
      SEND_KEY: ${{ secrets.SEND_KEY }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 确认浏览器环境
        run: |
          google-chrome --version
          "${CHROMEWEBDRIVER}/chromedriver" --version
          echo "CHROME_BIN=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER_BIN=${CHROMEWEBDRIVER}/chromedriver" >> "$GITHUB_ENV"

      - name: 安装 Python 包
        run: pip install -r requirements.txt

      - name: 检查必需配置
        run: |
          [ -n "$HUYA_COOKIE" ] || { echo "❌ 未配置 HUYA_COOKIE"; exit 1; }

      - name: 运行虎粮发放
        run: python main.py
